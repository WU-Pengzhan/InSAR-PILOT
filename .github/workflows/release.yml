name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - name: Install raster and transport test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin aria2
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run mkdocs build --strict
      - run: uv run python -m build
      - name: Validate package and compute checksums
        run: |
          uv run python scripts/check_release.py
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s "docs/releases/$version.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" || { echo "Release is already published; refusing to modify immutable assets."; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "InSAR-PILOT $GITHUB_REF_NAME" --notes-file "docs/releases/$version.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "docs/releases/$version.md"
