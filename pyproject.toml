[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-pilot"
version = "1.5.0"
description = "Local Web workbench for Sentinel-1 SAR/InSAR processing on Ubuntu and WSL."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "InSAR-PILOT Contributors"},
]
keywords = ["insar", "sar", "sentinel-1", "topsstack", "wsl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "asf-search>=12.0",
  "pyshp>=2.3",
  "requests>=2.31",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "wsproto>=1.2,<2",
  "shapely>=1.8",
  "h5py>=3.10",
  "numpy>=1.24",
  "Pillow>=10",
  "rasterio>=1.3",
]

[project.urls]
Homepage = "https://github.com/WU-Pengzhan/InSAR-PILOT"
Source = "https://github.com/WU-Pengzhan/InSAR-PILOT"
Issues = "https://github.com/WU-Pengzhan/InSAR-PILOT/issues"

[project.optional-dependencies]
web = []

nisar = [
  "h5py>=3.10",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "httpx>=0.27",
  "ruff",
  "build",
  "mypy>=1.11",
  "types-shapely>=2",
  "mkdocs-material>=9.5",
]

[project.scripts]
insar-pilot = "insar_pilot.web.launch:main"
insar-pilot-cli = "insar_pilot.cli.main:main"
insar-pilot-nisar = "insar_pilot.cli.nisar:main"
insar-pilot-web = "insar_pilot.web.launch:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["insar_pilot.ui*", "insar_pilot.i18n*", "insar_pilot.controllers*", "*.__pycache__*"]

[tool.setuptools.package-data]
"insar_pilot.web" = ["static/*", "static/assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["insar_pilot.services", "insar_pilot.domain", "insar_pilot.download", "insar_pilot.cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# The Qt-free layers are held to a stricter standard: every def must be typed.
[[tool.mypy.overrides]]
module = [
  "insar_pilot.domain.*",
  "insar_pilot.services.*",
  "insar_pilot.download.*",
  "insar_pilot.cli.*",
]
disallow_untyped_defs = true

# pyshp (imported as `shapefile`) ships no type stubs.
[[tool.mypy.overrides]]
module = ["shapefile"]
ignore_missing_imports = true

# Third-party network/geo libraries in the download layer that ship no type
# stubs or py.typed marker. Their public surfaces are untyped, so we suppress
# missing-import errors per module rather than globally.
[[tool.mypy.overrides]]
module = ["asf_search", "h5py", "rasterio", "rasterio.*"]
ignore_missing_imports = true
